# Project-wide Gradle settings.

# JVM heap for the Gradle daemon (Hilt/kapt annotation processing benefits from headroom).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required: AGP 8.2.2 defaults android.useAndroidX to false (the default only flips to
# true automatically starting in AGP 9.0.0). Every dependency in this project
# (androidx.core, androidx.compose.*, androidx.hilt, androidx.navigation, ...) is an
# AndroidX artifact, so without this flag the build fails immediately with:
# "This project uses AndroidX dependencies, but the 'android.useAndroidX' property is not enabled."
android.useAndroidX=true

# Enables Jetifier so any transitive legacy support-library dependency gets rewritten
# to AndroidX automatically. Not currently required by anything in build.gradle.kts,
# but this is standard alongside useAndroidX and costs nothing if unused.
android.enableJetifier=true

# Use non-transitive R classes for slightly faster incremental builds (AGP default
# recommendation since 4.2+; safe no-op if unused).
android.nonTransitiveRClass=true

# Kotlin code style used by IDEs opening this project.
kotlin.code.style=official
